spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vueshines}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vueshines}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vueshines}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

management.endpoints.web.exposure.include=health

app.search-indexing-enabled=${APP_SEARCH_INDEXING_ENABLED:false}
